# Sweep: the agent on a split or a list of problems, scored by the CVDP harness.
#   workflow_dispatch  a real run with an OpenRouter model (the key reaches the agent only through CVDP_AGENT_ENV)
#   pull_request       a smoke run with the scripted `fake` provider on 2 problems: no secret, proves the image, the
#                      harness interface and the collection end to end. Its pass rate is not the point.
name: Sweep

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model ID (or 'fake' for the scripted provider)"
        type: string
        default: anthropic/claude-haiku-5.5
      split:
        description: "Dataset split"
        type: choice
        options: [agentic, heavy]
        default: agentic
      ids:
        description: "Comma-separated problem ids (blank = the whole split)"
        type: string
        default: ""
      budget_usd:
        description: "Per-problem budget, USD (provider-reported cost)"
        type: string
        default: "0.10"
      max_turns:
        description: "Turn cap (edit, check, reflect)"
        type: string
        default: "10"
      self_check:
        description: "Self-written testbench step"
        type: boolean
        default: true
      lint:
        description: "Verilator lint and Yosys synth checks"
        type: boolean
        default: true
      threads:
        description: "Problems run in parallel"
        type: string
        default: "2"
      runner:
        description: "Runner: x86-64 or Arm64"
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm]
        default: ubuntu-24.04
      run_budget_usd:
        description: "Whole-job guard over all seeds, USD (blank = budget_usd x problems x seeds x 1.2)"
        type: string
        default: ""
      reasoning:
        description: "Reasoning effort sent to OpenRouter (default = the model's own; off = none)"
        type: choice
        options: [low, default, medium, high, "off"]
        default: low
      seeds:
        description: "Independent repeats of the problem list, run one after another"
        type: string
        default: "1"
      seed_offset:
        description: "Number the seeds from seed_offset+1 (a second dispatch of the same arm pools with distinct seeds)"
        type: string
        default: "0"
      harness:
        description: "Agent harness: langgraph (M1-M3), deepagents (M3b) or claudecode (Claude Code on the plan; model = a Claude model id)"
        type: choice
        options: [langgraph, deepagents, claudecode]
        default: langgraph
      memory:
        description: "Lessons snapshot in the repo, e.g. docs/reports/m3b/lessons/lessons_<hash>.json (blank = none)"
        type: string
        default: ""
      mutation_gate:
        description: "M3c: mutation-score gate on the agent's own testbench before submit (langgraph only)"
        type: boolean
        default: false
      interface_check:
        description: "M3c: interface diff by elaboration after each edit (langgraph only)"
        type: boolean
        default: false
      provider_order:
        description: "Pin OpenRouter providers, comma-separated, in order, no fallbacks (blank = OpenRouter routes)"
        type: string
        default: ""
  pull_request:

permissions:
  contents: read
  packages: read

env:
  CVDP_SHA: 8e894cf74414ab1eaea1e2b4e80a02f123df07b6
  DATASET_REV: 5b807d945f6a99aa645f7e43a64a2115e281b4bf
  SIM: ghcr.io/brendanjameslynskey/cvdp-sim:8e894cf
  AGENT: ghcr.io/brendanjameslynskey/cvdp-rtl-agent
  SMOKE_IDS: cvdp_agentic_barrel_shifter_0002,cvdp_agentic_lfsr_0001
  # The run's settings; a pull request always gets the fake-provider smoke run.
  SPLIT: ${{ github.event_name == 'pull_request' && 'agentic' || inputs.split }}
  MODEL: ${{ github.event_name == 'pull_request' && 'fake' || inputs.model }}
  BUDGET_USD: ${{ github.event_name == 'pull_request' && '0.10' || inputs.budget_usd }}
  RUN_BUDGET_USD: ${{ github.event_name == 'pull_request' && '' || inputs.run_budget_usd }}
  MAX_TURNS: ${{ github.event_name == 'pull_request' && '10' || inputs.max_turns }}
  SELF_CHECK: ${{ (github.event_name == 'pull_request' || inputs.self_check) && '1' || '0' }}
  LINT: ${{ (github.event_name == 'pull_request' || inputs.lint) && '1' || '0' }}
  THREADS: ${{ github.event_name == 'pull_request' && '2' || inputs.threads }}
  REASONING: ${{ github.event_name == 'pull_request' && 'low' || inputs.reasoning }}
  # The smoke run uses 2 seeds, so the repeat path (work dirs, seed column, table across seeds) runs on every PR.
  SEEDS: ${{ github.event_name == 'pull_request' && '2' || inputs.seeds }}
  SEED_OFFSET: ${{ github.event_name == 'pull_request' && '0' || inputs.seed_offset }}
  PROVIDER_ORDER: ${{ github.event_name == 'pull_request' && '' || inputs.provider_order }}
  HARNESS: ${{ github.event_name == 'pull_request' && 'langgraph' || inputs.harness }}
  MEMORY: ${{ github.event_name == 'pull_request' && '' || inputs.memory }}
  MUTATION_GATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mutation_gate) && '1' || '0' }}
  INTERFACE_CHECK: ${{ (github.event_name == 'workflow_dispatch' && inputs.interface_check) && '1' || '0' }}
  RUNNER: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || inputs.runner }}
  WORK: work
  REAL_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model != 'fake' }}

jobs:
  sweep:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulation image from GHCR
        run: |
          if ! docker pull -q "$SIM"; then
            # Only until images.yml has pushed it once: build from the pinned harness (about 20 min).
            echo "::warning::$SIM not in GHCR yet; building it from source"
            git clone -q https://github.com/NVlabs/cvdp_benchmark.git /tmp/cvdp-src
            git -C /tmp/cvdp-src checkout -q "$CVDP_SHA"
            docker build -q -f /tmp/cvdp-src/docker/Dockerfile.sim -t "$SIM" /tmp/cvdp-src
          fi
          docker tag "$SIM" nvidia/cvdp-sim:v1.0.0

      - name: Agent image
        id: agent
        run: |
          tag=$(git log -1 --format=%H -- agent docker)
          img="$AGENT:$tag"
          # The PR smoke run always builds the image from this commit (that is part of what it checks); a sweep pulls
          # the one images.yml pushed, and builds it only if that is not there yet.
          if [ "${{ github.event_name }}" = pull_request ] || ! docker pull -q "$img"; then
            docker build -q -f docker/agent.Dockerfile --build-arg SIM_IMAGE="$SIM" --build-arg AGENT_VERSION="$tag" -t "$img" .
          fi
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "Agent image: \`$img\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Harness at a pinned commit
        run: |
          git clone -q https://github.com/NVlabs/cvdp_benchmark.git cvdp
          git -C cvdp checkout -q "$CVDP_SHA"
          pip install -q -r cvdp/requirements.txt
          cp cvdp/.env.example cvdp/.env
          echo "OSS_SIM_IMAGE=nvidia/cvdp-sim:v1.0.0" >> cvdp/.env

      - name: Dataset at a pinned revision
        run: |
          mkdir -p data
          base="https://huggingface.co/datasets/nvidia/cvdp-benchmark-dataset/resolve/$DATASET_REV"
          for f in agentic_code_generation_no_commercial agentic_heavy_code_generation_no_commercial; do
            curl -sSfL -o "data/$f.jsonl" "$base/cvdp_v1.1.0_$f.jsonl"
          done
          if [ "$SPLIT" = heavy ]; then
            mkdir -p data/heavy
            tree="https://huggingface.co/api/datasets/nvidia/cvdp-benchmark-dataset/tree/$DATASET_REV/cvdp_v1.1.0_agentic_heavy_code_generation_public"
            for b in $(curl -sSf "$tree" | python3 -c "import json,sys;[print(x['path'].rsplit('/',1)[1]) for x in json.load(sys.stdin) if x['path'].endswith('.bundle')]"); do
              curl -sSfL -o "data/heavy/$b" "$base/cvdp_v1.1.0_agentic_heavy_code_generation_public/$b"
            done
            echo "CVDP_HEAVY_REPOS_PATH=$PWD/data/heavy" >> cvdp/.env
          fi

      - name: Key usage before the run
        id: usage_before
        if: env.REAL_MODEL == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/key_usage.py >> "$GITHUB_OUTPUT"

      - name: Run
        # Its own timeout, under the job's, so collection, the key scan and the upload still run when it hits.
        timeout-minutes: 320
        env:
          OPENROUTER_API_KEY: ${{ env.REAL_MODEL == 'true' && secrets.OPENROUTER_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.HARNESS == 'claudecode' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          AGENT_IMAGE: ${{ steps.agent.outputs.image }}
          IDS: ${{ github.event_name == 'pull_request' && env.SMOKE_IDS || inputs.ids }}
          # The Run step's 320 min, less a margin: a seed starts only if its worst case fits in what is left.
          STEP_BUDGET_S: "19000"
        run: bash tools/sweep.sh run

      - name: Collect and tabulate
        if: always() && steps.agent.outcome == 'success'
        run: |
          bash tools/sweep.sh collect
          cat work/table.md >> "$GITHUB_STEP_SUMMARY"
          # The per-problem rows in the log too (no secrets in them: ids, counts, provider-reported cost)
          [ ! -f work/results.csv ] || cat work/results.csv

      - name: Key usage after the run
        if: always() && env.REAL_MODEL == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BEFORE: ${{ steps.usage_before.outputs.usage }}
        run: |
          after=$(python3 tools/key_usage.py | cut -d= -f2)
          python3 - "$BEFORE" "$after" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys
          b, a = sys.argv[1], sys.argv[2]
          line = f"\nKey usage (OpenRouter `/api/v1/key`, `usage` only): before ${b}, after ${a}"
          try:
              line += f", change ${float(a) - float(b):.4f}. Compare with the run spend above: a larger change means "
              line += "spend the agents did not see reported (or other use of the key during the run)."
          except ValueError:
              line += "."
          print(line)
          EOF

      - name: Smoke checks (plumbing, not score)
        if: github.event_name == 'pull_request'
        run: python3 tools/smoke_check.py work 2 "$SEEDS"

      - name: Secret check on what gets uploaded
        id: scan
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ env.REAL_MODEL == 'true' && secrets.OPENROUTER_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.HARNESS == 'claudecode' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          if grep -rl -e 'sk-ant-' work work.* 2>/dev/null; then echo "::error::token-shaped string in work dir"; exit 1; fi
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && grep -rlF -e "$CLAUDE_CODE_OAUTH_TOKEN" work work.* 2>/dev/null; then
            echo "::error::token in work dir"; exit 1
          fi
          # Never upload the key: fail if it, or anything shaped like it, is anywhere in the work dir, binary files
          # included. The upload below runs only when this step succeeds.
          if grep -rl -e 'sk-or-' work work.* 2>/dev/null; then echo "::error::key-shaped string in work dir"; exit 1; fi
          if [ -n "$OPENROUTER_API_KEY" ] && grep -rlF -e "$OPENROUTER_API_KEY" work work.* 2>/dev/null; then
            echo "::error::key in work dir"; exit 1
          fi
          echo "no key in work dir"

      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: sweep-${{ github.event_name == 'pull_request' && 'smoke' || inputs.split }}-${{ github.run_id }}
          path: |
            work/results.csv
            work/table.md
            work/seed*.skipped
            work/seed*/raw_result.json
            work/seed*/report.json
            work/seed*/*/reports/*.txt
            work/seed*/*/harness/*/rundir/agent_out/**
            work/seed*/*/harness/*/rundir/agent_tb/**
            work/seed*/*/harness/*/agent_changes.patch
            work.problems.jsonl
            work.run.json
            work.ledger/*.json
          if-no-files-found: warn
